<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #222;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
            text-align: center;
        }

        .flash-list {
            margin: 0 0 18px;
            padding: 0;
            list-style: none;
        }

        .flash-list li {
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fff3cd;
            color: #664d03;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            margin-bottom: 18px;
            padding: 0 12px;
            border: 1px solid #cfd6df;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .auth-link {
            margin: 20px 0 0;
            text-align: center;
            font-size: 14px;
        }

        .auth-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="auth-box">
        <h1>회원가입</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-list">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="post">
            <label for="userAccountId">아이디</label>
            <input
                type="text"
                id="userAccountId"
                name="userAccountId"
                value="{{ request.form.get('userAccountId', '') }}"
                autocomplete="username"
                required
            >

            <label for="userName">이름</label>
            <input
                type="text"
                id="userName"
                name="userName"
                value="{{ request.form.get('userName', '') }}"
                autocomplete="name"
                required
            >

            <label for="userPhoneNumber">전화번호</label>
            <input
                type="tel"
                id="userPhoneNumber"
                name="userPhoneNumber"
                value="{{ request.form.get('userPhoneNumber', '') }}"
                placeholder="010-1234-5678"
                autocomplete="tel"
                required
            >

            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="password_confirm">비밀번호 확인</label>
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                autocomplete="new-password"
                required
            >

            <button type="submit">회원가입</button>
        </form>

        <p class="auth-link">
            이미 계정이 있나요?
            <a href="{{ url_for('login') }}">로그인</a>
        </p>
    </main>
</body>
</html>
